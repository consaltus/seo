[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 verlangt Node >= 22.23.4
  NODE_VERSION = "22.23.4"
  ASTRO_TELEMETRY_DISABLED = "1"

[[headers]]
  for = "/h/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
